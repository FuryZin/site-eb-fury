<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fury Market — Marketplace Oficial Free Fire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        furyBg: '#0a0a0c',
                        furyCard: '#121216',
                        furyBorder: '#262630',
                        furyAccent: '#00ff66',
                        furyAccentHover: '#00cc52',
                        furyOrange: '#ff6600',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-furyBg text-gray-100 font-sans min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- NAVBAR RESPONSIVA -->
    <header class="bg-furyCard border-b border-furyBorder sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 md:h-20 flex items-center justify-between gap-2">
            
            <!-- LOGO -->
            <div class="flex items-center gap-2 cursor-pointer select-none" onclick="navigate('home')">
                <i class="fa-solid fa-gamepad text-furyAccent text-2xl md:text-3xl"></i>
                <span class="text-lg md:text-xl font-black text-white tracking-wider">FURY<span class="text-furyAccent">MARKET</span></span>
            </div>

            <!-- MENU DESKTOP (PC) -->
            <div class="hidden lg:flex items-center gap-6 text-sm font-semibold">
                <button onclick="navigate('home')" class="hover:text-furyAccent transition">Início</button>
                <button id="myOrdersNavBtn" onclick="navigate('my-orders')" class="hidden hover:text-furyAccent transition"><i class="fa-solid fa-bag-shopping mr-1"></i>Meus Pedidos</button>
                <button id="sellerDashNavBtn" onclick="navigate('seller-dashboard')" class="hidden text-furyAccent font-bold hover:underline"><i class="fa-solid fa-box-open mr-1"></i>Painel Vendedor</button>
                <button onclick="navigate('seller')" class="hover:text-furyAccent text-furyOrange transition"><i class="fa-solid fa-store mr-1"></i>Seja Vendedor</button>
                <button onclick="navigate('tickets')" class="hover:text-furyAccent transition">Suporte</button>
                <button id="adminNavBtn" onclick="navigate('admin')" class="hidden text-red-400 font-bold hover:underline"><i class="fa-solid fa-crown mr-1"></i>Dono</button>
            </div>

            <!-- ÁREA DE AUTENTICAÇÃO + BOTÃO MENU MOBILE -->
            <div class="flex items-center gap-2 md:gap-4">
                <div id="authNavArea"></div>
                <button onclick="toggleMobileMenu()" class="lg:hidden bg-furyBg border border-furyBorder p-2 rounded-lg text-gray-300 hover:text-white">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
            </div>

        </div>

        <!-- MENU GAVETA MOBILE (CELULAR / TABLET) -->
        <div id="mobileMenu" class="hidden lg:hidden bg-furyCard border-b border-furyBorder px-4 py-4 space-y-3 text-sm font-semibold">
            <button onclick="navigate('home'); toggleMobileMenu()" class="block w-full text-left py-2 hover:text-furyAccent"><i class="fa-solid fa-house mr-2 text-furyAccent"></i>Início</button>
            <button id="mobileOrdersBtn" onclick="navigate('my-orders'); toggleMobileMenu()" class="hidden w-full text-left py-2 hover:text-furyAccent"><i class="fa-solid fa-bag-shopping mr-2 text-furyAccent"></i>Meus Pedidos</button>
            <button id="mobileSellerDashBtn" onclick="navigate('seller-dashboard'); toggleMobileMenu()" class="hidden w-full text-left py-2 text-furyAccent font-bold"><i class="fa-solid fa-box-open mr-2"></i>Painel do Vendedor</button>
            <button onclick="navigate('seller'); toggleMobileMenu()" class="block w-full text-left py-2 text-furyOrange font-bold"><i class="fa-solid fa-store mr-2"></i>Seja Vendedor</button>
            <button onclick="navigate('tickets'); toggleMobileMenu()" class="block w-full text-left py-2 hover:text-furyAccent"><i class="fa-solid fa-headset mr-2 text-furyAccent"></i>Suporte</button>
            <button id="mobileAdminBtn" onclick="navigate('admin'); toggleMobileMenu()" class="hidden w-full text-left py-2 text-red-400 font-bold"><i class="fa-solid fa-crown mr-2"></i>Painel do Dono</button>
        </div>
    </header>

    <!-- ALERTA GLOBAL -->
    <div id="globalAlert" class="hidden max-w-7xl mx-auto my-3 px-4">
        <div id="globalAlertBody" class="p-3 md:p-4 rounded-xl text-center text-xs md:text-sm font-bold"></div>
    </div>

    <!-- CONTEÚDO PRINCIPAL DINÂMICO -->
    <main id="appContent" class="max-w-7xl mx-auto px-3 md:px-4 py-4 md:py-8 flex-1 w-full"></main>

    <!-- RODAPÉ -->
    <footer class="bg-furyCard border-t border-furyBorder py-6 text-center text-xs md:text-sm text-gray-400 mt-auto">
        <div class="max-w-7xl mx-auto px-4">
            <strong>FURYMARKET &copy; 2026</strong> — Todos os direitos reservados.
        </div>
    </footer>

    <!-- JAVASCRIPT DO SISTEMA -->
    <script>
        let currentUser = localStorage.getItem('fury_user');
        let currentRole = localStorage.getItem('fury_role');
        let authToken = localStorage.getItem('fury_token');
        let isCreatingOrder = false;

        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        }

        function updateNav() {
            const authArea = document.getElementById('authNavArea');
            const adminBtn = document.getElementById('adminNavBtn');
            const sellerBtn = document.getElementById('sellerDashNavBtn');
            const ordersBtn = document.getElementById('myOrdersNavBtn');

            const mAdminBtn = document.getElementById('mobileAdminBtn');
            const mSellerBtn = document.getElementById('mobileSellerDashBtn');
            const mOrdersBtn = document.getElementById('mobileOrdersBtn');

            if (currentRole === 'admin') {
                adminBtn.classList.remove('hidden');
                mAdminBtn.classList.remove('hidden');
            } else {
                adminBtn.classList.add('hidden');
                mAdminBtn.classList.add('hidden');
            }

            if (currentRole === 'seller' || currentRole === 'admin') {
                sellerBtn.classList.remove('hidden');
                mSellerBtn.classList.remove('hidden');
            } else {
                sellerBtn.classList.add('hidden');
                mSellerBtn.classList.add('hidden');
            }

            if (currentUser) {
                ordersBtn.classList.remove('hidden');
                mOrdersBtn.classList.remove('hidden');

                authArea.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-xs md:text-sm font-bold max-w-[100px] md:max-w-none truncate"><i class="fa-solid fa-user ${currentRole === 'admin' ? 'text-red-400' : 'text-furyAccent'} mr-1"></i>${currentUser}</span>
                        <button onclick="logout()" class="bg-furyBorder hover:bg-red-900/40 text-red-400 font-bold px-2.5 md:px-3 py-1.5 rounded-lg text-xs transition">Sair</button>
                    </div>
                `;
            } else {
                ordersBtn.classList.add('hidden');
                mOrdersBtn.classList.add('hidden');

                authArea.innerHTML = `
                    <button onclick="navigate('login')" class="bg-furyAccent hover:bg-furyAccentHover text-furyBg font-bold px-3 md:px-4 py-1.5 md:py-2 rounded-lg text-xs md:text-sm transition">Entrar</button>
                `;
            }
        }

        function logout() {
            localStorage.clear();
            currentUser = null; currentRole = null; authToken = null;
            updateNav(); navigate('home');
        }

        function showAlert(msg, success) {
            const box = document.getElementById('globalAlert');
            const body = document.getElementById('globalAlertBody');
            box.classList.remove('hidden');
            body.className = `p-3 md:p-4 rounded-xl text-center text-xs md:text-sm font-bold ${success ? 'bg-green-500/20 text-green-400 border border-green-500/30' : 'bg-red-500/20 text-red-400 border border-red-500/30'}`;
            body.innerText = msg;
            setTimeout(() => box.classList.add('hidden'), 4000);
        }

        async function navigate(page, extraId = null) {
            const container = document.getElementById('appContent');
            updateNav();

            if (page === 'home') {
                container.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-furyAccent"></i></div>`;
                const res = await fetch('/api/products');
                const data = await res.json();
                container.innerHTML = `
                    <section class="bg-gradient-to-r from-zinc-900 to-furyCard border border-furyBorder rounded-2xl p-5 md:p-8 mb-6 md:mb-8">
                        <span class="bg-furyAccent/10 text-furyAccent text-[10px] md:text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">MARKETPLACE GAMER</span>
                        <h1 class="text-2xl md:text-4xl font-black mt-3 mb-2 text-white leading-tight">Compre Diamantes e Serviços para <span class="text-furyAccent">Free Fire</span></h1>
                        <p class="text-gray-400 text-xs md:text-sm mb-4">Entrega via Chat GGMAX, vendedores verificados e suporte 24h.</p>
                    </section>
                    <h2 class="text-lg md:text-xl font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-fire text-furyOrange"></i> Produtos em Destaque</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                        ${data.products.map(p => `
                            <div class="bg-furyCard border border-furyBorder rounded-xl p-4 flex flex-col justify-between">
                                <div>
                                    <div class="h-40 md:h-44 bg-zinc-900 rounded-lg overflow-hidden mb-3 relative flex items-center justify-center">
                                        ${p.image_url ? `<img src="${p.image_url}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-gem text-5xl text-furyAccent"></i>`}
                                        ${p.promo_price > 0 ? `<span class="absolute top-2 right-2 bg-furyOrange text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">PROMOÇÃO</span>` : ''}
                                    </div>
                                    <span class="text-[10px] text-gray-500 uppercase font-bold tracking-wider">${p.category}</span>
                                    <h3 class="font-bold text-white text-base mt-0.5">${p.title}</h3>
                                    <p class="text-xs text-gray-400 mt-1 mb-3">${p.description}</p>
                                </div>
                                <div>
                                    <div class="text-base md:text-lg font-black text-white mb-3">
                                        ${p.promo_price > 0 ? `<span class="line-through text-gray-500 text-xs mr-2">R$ ${p.price.toFixed(2)}</span><span class="text-furyAccent">R$ ${p.promo_price.toFixed(2)}</span>` : `R$ ${p.price.toFixed(2)}`}
                                        <span class="text-[11px] text-gray-500 font-normal block">Vendedor: ${p.seller_name}</span>
                                    </div>
                                    <button id="buyBtn_${p.id}" onclick="createOrder('${p.title}', ${p.promo_price > 0 ? p.promo_price : p.price}, ${p.seller_id}, '${p.seller_name}', ${p.id})" class="w-full bg-furyAccent text-furyBg font-bold py-2.5 rounded-lg text-xs md:text-sm transition">Comprar Agora (GGMAX)</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            else if (page === 'my-orders') {
                if (!authToken) return showAlert('Faça login primeiro!', false);
                container.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-furyAccent"></i></div>`;
                const res = await fetch('/api/orders/my-orders', { headers: { 'Authorization': 'Bearer ' + authToken } });
                const data = await res.json();

                container.innerHTML = `
                    <div class="max-w-4xl mx-auto">
                        <h2 class="text-xl md:text-2xl font-black mb-6 text-white"><i class="fa-solid fa-bag-shopping text-furyAccent mr-2"></i> Meus Pedidos</h2>
                        <div class="space-y-3 md:space-y-4">
                            ${data.orders.length === 0 ? '<p class="text-gray-400 text-sm">Você ainda não comprou nenhum item.</p>' : ''}
                            ${data.orders.map(o => `
                                <div class="bg-furyCard border border-furyBorder p-4 md:p-5 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                                    <div>
                                        <div class="font-bold text-white text-sm md:text-base">${o.product_title} <span class="text-xs text-furyAccent font-mono">(${o.order_code})</span></div>
                                        <div class="text-xs text-gray-400 mt-1">Vendedor: <strong>${o.seller_name}</strong> • Valor: <strong>R$ ${o.amount.toFixed(2)}</strong></div>
                                        <div class="mt-2"><span class="text-[10px] md:text-xs font-bold px-2 py-0.5 rounded ${o.status === 'completed' ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'}">${o.status === 'completed' ? '✅ Entregue' : '⏳ Aguardando Entrega'}</span></div>
                                    </div>
                                    <button onclick="openOrderChat(${o.id})" class="w-full md:w-auto bg-furyAccent text-furyBg font-bold px-4 py-2 rounded-lg text-xs md:text-sm"><i class="fa-solid fa-comments mr-1"></i> Abrir Chat do Pedido</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            else if (page === 'seller-dashboard') {
                if (currentRole !== 'seller' && currentRole !== 'admin') return showAlert('Acesso restrito ao painel.', false);
                
                const resProd = await fetch('/api/seller/my-products', { headers: { 'Authorization': 'Bearer ' + authToken } });
                const dataProd = await resProd.json();

                const resSales = await fetch('/api/orders/seller-sales', { headers: { 'Authorization': 'Bearer ' + authToken } });
                const dataSales = await resSales.json();

                container.innerHTML = `
                    <div class="max-w-4xl mx-auto">
                        <h2 class="text-xl md:text-2xl font-black text-furyAccent mb-6"><i class="fa-solid fa-store mr-2"></i> Painel do Vendedor</h2>

                        <div class="bg-furyCard border border-furyBorder p-4 md:p-6 rounded-2xl mb-6 md:mb-8">
                            <h3 class="font-bold mb-4 text-white text-sm md:text-base"><i class="fa-solid fa-receipt text-furyOrange mr-2"></i> Vendas Recebidas</h3>
                            <div class="space-y-3">
                                ${dataSales.sales.length === 0 ? '<p class="text-xs text-gray-500">Nenhuma venda realizada ainda.</p>' : ''}
                                ${dataSales.sales.map(s => `
                                    <div class="bg-furyBg border border-furyBorder p-3 md:p-4 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 text-xs md:text-sm">
                                        <div>
                                            <strong class="text-white">${s.product_title}</strong> (${s.order_code})
                                            <div class="text-xs text-gray-400">Comprador: <strong>${s.buyer_name}</strong> • R$ ${s.amount.toFixed(2)}</div>
                                            <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded ${s.status === 'completed' ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'}">${s.status}</span>
                                        </div>
                                        <button onclick="openOrderChat(${s.id})" class="w-full sm:w-auto bg-furyAccent text-furyBg font-bold px-3 py-1.5 rounded-lg text-xs">Abrir Chat / Entregar</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="bg-furyCard border border-furyBorder p-4 md:p-6 rounded-2xl">
                            <h3 class="font-bold mb-4 text-white text-sm md:text-base">Publicar Novo Anúncio</h3>
                            <form id="createProductForm" class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4 text-xs md:text-sm">
                                <div><label class="block text-gray-400 mb-1">Título do Anúncio</label><input type="text" id="prodTitle" required placeholder="Ex: Conta Mestre Free Fire" class="w-full bg-furyBg border border-furyBorder rounded-lg p-2.5 text-white"></div>
                                <div><label class="block text-gray-400 mb-1">Categoria</label><select id="prodCategory" class="w-full bg-furyBg border border-furyBorder rounded-lg p-2.5 text-white"><option>Diamantes</option><option>Gift Cards</option><option>Coaching</option><option>Serviços</option></select></div>
                                <div><label class="block text-gray-400 mb-1">Preço Normal (R$)</label><input type="number" step="0.01" id="prodPrice" required class="w-full bg-furyBg border border-furyBorder rounded-lg p-2.5 text-white"></div>
                                <div><label class="block text-gray-400 mb-1">Preço Promocional (R$)</label><input type="number" step="0.01" id="prodPromoPrice" class="w-full bg-furyBg border border-furyBorder rounded-lg p-2.5 text-white"></div>
                                <div class="md:col-span-2"><label class="block text-gray-400 mb-1">URL da Imagem Ilustrativa</label><input type="text" id="prodImageUrl" placeholder="https://exemplo.com/imagem.png" class="w-full bg-furyBg border border-furyBorder rounded-lg p-2.5 text-white"></div>
                                <div class="md:col-span-2"><label class="block text-gray-400 mb-1">Descrição</label><textarea id="prodDesc" rows="2" required class="w-full bg-furyBg border border-furyBorder rounded-lg p-2.5 text-white"></textarea></div>
                                <div class="md:col-span-2"><button type="submit" class="w-full bg-furyAccent text-furyBg font-bold py-3 rounded-lg text-sm">Publicar Anúncio</button></div>
                            </form>
                        </div>
                    </div>
                `;

                document.getElementById('createProductForm').onsubmit = async (e) => {
                    e.preventDefault();
                    const res = await fetch('/api/products/create', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                        body: JSON.stringify({
                            title: document.getElementById('prodTitle').value,
                            category: document.getElementById('prodCategory').value,
                            price: document.getElementById('prodPrice').value,
                            promoPrice: document.getElementById('prodPromoPrice').value,
                            imageUrl: document.getElementById('prodImageUrl').value,
                            description: document.getElementById('prodDesc').value
                        })
                    });
                    const resData = await res.json();
                    showAlert(resData.message, resData.success);
                    if (resData.success) navigate('seller-dashboard');
                };
            }

            else if (page === 'order-chat') {
                const res = await fetch(`/api/orders/${extraId}/chat`, { headers: { 'Authorization': 'Bearer ' + authToken } });
                const data = await res.json();
                
                if (!data.success) {
                    showAlert(data.message, false);
                    return navigate('my-orders');
                }

                const order = data.order;
                const isSellerOrAdmin = (currentRole === 'seller' || currentRole === 'admin');

                container.innerHTML = `
                    <div class="max-w-3xl mx-auto bg-furyCard border border-furyBorder rounded-2xl overflow-hidden flex flex-col h-[80vh] md:h-[650px]">
                        <div class="bg-zinc-900 border-b border-furyBorder p-3 md:p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                            <div>
                                <h3 class="font-bold text-white text-sm md:text-base">${order.product_title}</h3>
                                <span class="text-xs text-furyAccent font-mono">Pedido #${order.order_code} • R$ ${order.amount.toFixed(2)}</span>
                            </div>
                            <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                                ${isSellerOrAdmin && order.status !== 'completed' ? `<button onclick="completeOrder(${order.id})" class="bg-furyAccent text-furyBg font-bold px-3 py-1.5 rounded-lg text-xs">✅ Marcar Entregue</button>` : ''}
                                <span class="text-xs font-bold px-2 py-0.5 rounded ${order.status === 'completed' ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'}">${order.status === 'completed' ? 'CONCLUÍDO' : 'EM ANDAMENTO'}</span>
                            </div>
                        </div>

                        <div class="bg-furyBg border-b border-furyBorder p-2.5 text-center text-[11px] md:text-xs">
                            <span class="text-gray-400">Chave Pix para Pagamento:</span>
                            <div class="font-mono text-furyAccent font-bold select-all mt-0.5 break-all">${order.pix_payload}</div>
                        </div>

                        <div id="chatMessages" class="flex-1 p-3 md:p-4 overflow-y-auto space-y-3 bg-[#0c0c0e]">
                            ${data.messages.map(m => `
                                <div class="flex flex-col ${m.sender_name === currentUser ? 'items-end' : 'items-start'}">
                                    <span class="text-[10px] text-gray-500 mb-0.5">${m.sender_name}</span>
                                    <div class="max-w-[85%] md:max-w-md rounded-xl p-2.5 md:p-3 text-xs md:text-sm ${m.sender_name === 'Sistema' ? 'bg-yellow-500/10 border border-yellow-500/20 text-yellow-300 w-full text-center' : m.sender_name === currentUser ? 'bg-furyAccent text-furyBg font-semibold' : 'bg-furyCard border border-furyBorder text-white'}">
                                        ${m.message}
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <form id="sendMessageForm" class="p-2.5 md:p-3 bg-zinc-900 border-t border-furyBorder flex gap-2">
                            <input type="text" id="chatInput" required placeholder="Digite sua mensagem..." class="flex-1 bg-furyBg border border-furyBorder rounded-xl px-3 md:px-4 py-2 text-xs md:text-sm text-white focus:outline-none">
                            <button type="submit" class="bg-furyAccent text-furyBg font-bold px-4 md:px-5 py-2 rounded-xl text-xs md:text-sm"><i class="fa-solid fa-paper-plane"></i></button>
                        </form>
                    </div>
                `;

                const chatBox = document.getElementById('chatMessages');
                chatBox.scrollTop = chatBox.scrollHeight;

                document.getElementById('sendMessageForm').onsubmit = async (e) => {
                    e.preventDefault();
                    const input = document.getElementById('chatInput');
                    const msg = input.value;

                    const resMsg = await fetch(`/api/orders/${extraId}/send-message`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                        body: JSON.stringify({ message: msg })
                    });
                    const resData = await resMsg.json();
                    if (resData.success) navigate('order-chat', extraId);
                };
            }

            else if (page === 'login') {
                container.innerHTML = `
                    <div class="max-w-md mx-auto bg-furyCard border border-furyBorder p-6 md:p-8 rounded-2xl">
                        <h2 class="text-xl md:text-2xl font-black text-center mb-6">Acesse sua Conta</h2>
                        <form id="authForm" class="space-y-4 text-xs md:text-sm">
                            <div id="userField" class="hidden"><label class="block text-gray-400 mb-1">Nome de Usuário</label><input type="text" id="inputUsername" class="w-full bg-furyBg border border-furyBorder rounded-lg p-3 text-white"></div>
                            <div><label class="block text-gray-400 mb-1">E-mail</label><input type="email" id="inputEmail" required class="w-full bg-furyBg border border-furyBorder rounded-lg p-3 text-white"></div>
                            <div><label class="block text-gray-400 mb-1">Senha</label><input type="password" id="inputPassword" required class="w-full bg-furyBg border border-furyBorder rounded-lg p-3 text-white"></div>
                            
                            <div class="bg-furyBg border border-furyBorder p-3 rounded-lg flex items-center justify-between">
                                <label for="isOwnerCheck" class="text-xs font-bold text-red-400 cursor-pointer flex items-center gap-2"><i class="fa-solid fa-crown"></i> Entrar / Cadastrar como DONO</label>
                                <input type="checkbox" id="isOwnerCheck" class="w-4 h-4 accent-red-500 cursor-pointer" onchange="toggleOwnerField()">
                            </div>
                            <div id="ownerField" class="hidden">
                                <label class="block text-xs text-red-400 mb-1 font-bold">Senha Mestra dos Donos</label>
                                <input type="password" id="ownerSecret" placeholder="Digite a senha mestra de dono" class="w-full bg-furyBg border border-red-500/50 rounded-lg p-3 text-white">
                            </div>

                            <button type="submit" id="authSubmitBtn" class="w-full bg-furyAccent text-furyBg font-bold py-3 rounded-lg text-sm">Entrar</button>
                        </form>
                        <div class="text-center mt-4"><button onclick="toggleAuthMode()" id="toggleAuthText" class="text-xs text-furyAccent hover:underline">Não tem conta? Cadastre-se</button></div>
                    </div>
                `;

                let isRegistering = false;
                window.toggleAuthMode = () => {
                    isRegistering = !isRegistering;
                    document.getElementById('userField').classList.toggle('hidden', !isRegistering);
                    document.getElementById('authSubmitBtn').innerText = isRegistering ? 'Criar Conta' : 'Entrar';
                    document.getElementById('toggleAuthText').innerText = isRegistering ? 'Já tem conta? Faça Login' : 'Não tem conta? Cadastre-se';
                };

                window.toggleOwnerField = () => {
                    const isChecked = document.getElementById('isOwnerCheck').checked;
                    document.getElementById('ownerField').classList.toggle('hidden', !isChecked);
                };

                document.getElementById('authForm').onsubmit = async (e) => {
                    e.preventDefault();
                    const endpoint = isRegistering ? '/api/auth/register' : '/api/auth/login';
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            username: document.getElementById('inputUsername').value,
                            email: document.getElementById('inputEmail').value,
                            password: document.getElementById('inputPassword').value,
                            isOwner: document.getElementById('isOwnerCheck').checked,
                            ownerSecret: document.getElementById('ownerSecret').value
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        localStorage.setItem('fury_token', data.token);
                        localStorage.setItem('fury_user', data.username);
                        localStorage.setItem('fury_role', data.role);
                        currentUser = data.username; currentRole = data.role; authToken = data.token;
                        showAlert(data.message, true); navigate('home');
                    } else showAlert(data.message, false);
                };
            }

            else if (page === 'seller') {
                container.innerHTML = `
                    <div class="max-w-xl mx-auto bg-furyCard border border-furyBorder p-6 md:p-8 rounded-2xl">
                        <h2 class="text-xl md:text-2xl font-bold mb-2">Seja um Vendedor Autorizado</h2>
                        <form id="sellerAppForm" class="space-y-3 md:space-y-4 text-xs md:text-sm">
                            <div><label class="block text-gray-400 mb-1">Tag Discord</label><input type="text" id="appDiscordTag" required class="w-full bg-furyBg border border-furyBorder rounded-lg p-3 text-white"></div>
                            <div><label class="block text-gray-400 mb-1">ID Discord</label><input type="text" id="appDiscordId" required class="w-full bg-furyBg border border-furyBorder rounded-lg p-3 text-white"></div>
                            <div><label class="block text-gray-400 mb-1">Produtos Pretendidos</label><input type="text" id="appProducts" required class="w-full bg-furyBg border border-furyBorder rounded-lg p-3 text-white"></div>
                            <div><label class="block text-gray-400 mb-1">Descrição</label><textarea id="appDescription" required class="w-full bg-furyBg border border-furyBorder rounded-lg p-3 text-white" rows="3"></textarea></div>
                            <button type="submit" class="w-full bg-furyAccent text-furyBg font-bold py-3 rounded-lg text-sm">Enviar para Análise</button>
                        </form>
                    </div>
                `;
                document.getElementById('sellerAppForm').onsubmit = async (e) => {
                    e.preventDefault();
                    if (!authToken) return showAlert('Faça login primeiro!', false);
                    const res = await fetch('/api/seller/apply', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                        body: JSON.stringify({
                            discordTag: document.getElementById('appDiscordTag').value,
                            discordId: document.getElementById('appDiscordId').value,
                            products: document.getElementById('appProducts').value,
                            description: document.getElementById('appDescription').value
                        })
                    });
                    const data = await res.json();
                    showAlert(data.message, data.success);
                };
            }

            else if (page === 'tickets') {
                container.innerHTML = `
                    <div class="max-w-xl mx-auto bg-furyCard border border-furyBorder p-6 md:p-8 rounded-2xl">
                        <h2 class="text-xl md:text-2xl font-bold mb-2">Central de Suporte</h2>
                        <form id="ticketForm" class="space-y-3 md:space-y-4 text-xs md:text-sm">
                            <div><label class="block text-gray-400 mb-1">Assunto</label><input type="text" id="tckSubject" required class="w-full bg-furyBg border border-furyBorder rounded-lg p-3 text-white"></div>
                            <div><label class="block text-gray-400 mb-1">Categoria</label><select id="tckCategory" class="w-full bg-furyBg border border-furyBorder rounded-lg p-3 text-white"><option>Dúvidas</option><option>Vendas</option><option>Reembolso</option></select></div>
                            <div><label class="block text-gray-400 mb-1">Mensagem</label><textarea id="tckMessage" required rows="4" class="w-full bg-furyBg border border-furyBorder rounded-lg p-3 text-white"></textarea></div>
                            <button type="submit" class="w-full bg-furyAccent text-furyBg font-bold py-3 rounded-lg text-sm">Abrir Ticket</button>
                        </form>
                    </div>
                `;
                document.getElementById('ticketForm').onsubmit = async (e) => {
                    e.preventDefault();
                    if (!authToken) return showAlert('Faça login primeiro!', false);
                    const res = await fetch('/api/tickets/create', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                        body: JSON.stringify({
                            subject: document.getElementById('tckSubject').value,
                            category: document.getElementById('tckCategory').value,
                            message: document.getElementById('tckMessage').value
                        })
                    });
                    const data = await res.json();
                    showAlert(data.message, data.success);
                };
            }

            else if (page === 'admin') {
                if (currentRole !== 'admin') return showAlert('Acesso restrito ao Dono!', false);
                const res = await fetch('/api/admin/dashboard', { headers: { 'Authorization': 'Bearer ' + authToken } });
                const data = await res.json();

                container.innerHTML = `
                    <h2 class="text-xl md:text-2xl font-black mb-6 text-red-400 flex items-center gap-2"><i class="fa-solid fa-crown"></i> Painel do Dono</h2>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 md:gap-4 mb-6 md:mb-8 text-xs md:text-sm">
                        <div class="bg-furyCard border border-furyBorder p-4 rounded-xl"><span class="text-gray-400">Usuários</span><div class="text-xl md:text-2xl font-black text-white">${data.users.length}</div></div>
                        <div class="bg-furyCard border border-furyBorder p-4 rounded-xl"><span class="text-gray-400">Solicitações Vendedor</span><div class="text-xl md:text-2xl font-black text-furyOrange">${data.apps.length}</div></div>
                        <div class="bg-furyCard border border-furyBorder p-4 rounded-xl"><span class="text-gray-400">Pedidos Vendas</span><div class="text-xl md:text-2xl font-black text-furyAccent">${data.orders.length}</div></div>
                        <div class="bg-furyCard border border-furyBorder p-4 rounded-xl"><span class="text-gray-400">Tickets Suporte</span><div class="text-xl md:text-2xl font-black text-yellow-400">${data.tickets.length}</div></div>
                    </div>

                    <div class="bg-furyCard border border-furyBorder rounded-xl p-4 md:p-6 mb-8">
                        <h3 class="font-bold mb-4 text-white text-sm md:text-base">Solicitações de Vendedor Pendentes</h3>
                        <div class="space-y-3">
                            ${data.apps.length === 0 ? '<p class="text-xs text-gray-500">Nenhuma solicitação encontrada.</p>' : ''}
                            ${data.apps.map(a => `
                                <div class="bg-furyBg border border-furyBorder p-3 md:p-4 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 text-xs">
                                    <div>
                                        <strong>${a.username}</strong> (${a.discord_tag}) - <em>${a.products}</em>
                                        <div class="text-gray-400 mt-0.5">${a.description}</div>
                                    </div>
                                    ${a.status === 'pending' ? `
                                        <div class="flex gap-2 w-full sm:w-auto">
                                            <button onclick="approveSeller(${a.id}, ${a.user_id})" class="flex-1 sm:flex-none bg-furyAccent text-furyBg font-bold px-3 py-1.5 rounded text-xs">✅ Aceitar</button>
                                            <button onclick="rejectSeller(${a.id})" class="flex-1 sm:flex-none bg-red-500/20 text-red-400 font-bold px-3 py-1.5 rounded text-xs">❌ Recusar</button>
                                        </div>
                                    ` : `<span class="uppercase font-bold px-2 py-1 rounded ${a.status === 'approved' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">${a.status}</span>`}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }

        async function createOrder(title, price, sellerId, sellerName, prodId) {
            if (!authToken) return showAlert('Faça login primeiro para comprar!', false);
            if (isCreatingOrder) return;

            isCreatingOrder = true;
            const btn = document.getElementById(`buyBtn_${prodId}`);
            if (btn) {
                btn.disabled = true;
                btn.innerText = 'Gerando Pedido...';
            }

            try {
                const res = await fetch('/api/checkout/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                    body: JSON.stringify({ productTitle: title, amount: price, sellerId, sellerName })
                });
                const data = await res.json();
                if (data.success) {
                    showAlert('Pedido criado! Abrindo chat do pedido...', true);
                    setTimeout(() => navigate('order-chat', data.orderId), 500);
                } else {
                    showAlert(data.message, false);
                }
            } catch (e) {
                showAlert('Erro ao processar pedido.', false);
            } finally {
                isCreatingOrder = false;
            }
        }

        function openOrderChat(orderId) {
            navigate('order-chat', orderId);
        }

        async function completeOrder(orderId) {
            const res = await fetch(`/api/orders/${orderId}/complete`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + authToken }
            });
            const data = await res.json();
            showAlert(data.message, data.success);
            if (data.success) navigate('order-chat', orderId);
        }

        async function approveSeller(appId, userId) {
            const res = await fetch('/api/admin/approve-seller', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                body: JSON.stringify({ appId, userId })
            });
            const data = await res.json();
            showAlert(data.message, data.success);
            if (data.success) navigate('admin');
        }

        async function rejectSeller(appId) {
            const res = await fetch('/api/admin/reject-seller', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                body: JSON.stringify({ appId })
            });
            const data = await res.json();
            showAlert(data.message, data.success);
            if (data.success) navigate('admin');
        }

        navigate('home');
    </script>
</body>
</html>
